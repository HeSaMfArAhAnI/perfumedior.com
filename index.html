<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dior Perfume | به‌زودی</title>

<meta
    name="description"
    content="Dior Perfume — فروشگاه آنلاین عطر و ادکلن. فروشگاه ما به‌زودی فعالیت خود را آغاز می‌کند."
>

<meta name="theme-color" content="#10316B">

<meta name="robots" content="index,follow">


<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');


:root {

    --blue: #10316B;

    --deep: #06142e;

    --deep-2: #061733;

    --white: #ffffff;

    --muted: rgba(255,255,255,.70);

    --line: rgba(255,255,255,.15);

}


/* ================================
   RESET
================================ */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


html {

    scroll-behavior: smooth;

}


body {

    min-height: 100vh;

    overflow-y: auto;

    overflow-x: hidden;

    user-select: none;

    -webkit-user-select: none;

    font-family:
        "Vazirmatn",
        Tahoma,
        sans-serif;

    color: var(--white);

    background:

        radial-gradient(
            circle at 12% 18%,
            rgba(72,139,255,.22),
            transparent 28%
        ),

        radial-gradient(
            circle at 88% 78%,
            rgba(31,91,190,.25),
            transparent 31%
        ),

        linear-gradient(
            135deg,
            var(--deep),
            var(--blue) 52%,
            var(--deep-2)
        );

    background-attachment: fixed;

}


/* ================================
   CINEMATIC VIGNETTE
================================ */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 1;

    background:

        linear-gradient(
            115deg,
            transparent 0%,
            rgba(255,255,255,.035) 47%,
            transparent 53%
        ),

        radial-gradient(
            circle at center,
            transparent 35%,
            rgba(0,0,0,.30) 100%
        );

}


/* ================================
   AMBIENT LIGHT
================================ */

.ambient {

    position: fixed;

    width: 45vw;

    height: 45vw;

    min-width: 260px;

    min-height: 260px;

    left: -15vw;

    top: -14vw;

    border-radius: 50%;

    background:
        rgba(75,142,255,.14);

    filter: blur(60px);

    pointer-events: none;

    animation:
        ambientMove 12s
        ease-in-out
        infinite
        alternate;

}


.ambient::after {

    content: "";

    position: absolute;

    width: 70%;

    height: 70%;

    right: -80vw;

    bottom: -80vh;

    border-radius: 50%;

    background:
        rgba(75,145,255,.13);

    filter: blur(70px);

    animation:
        ambientMove2 15s
        ease-in-out
        infinite
        alternate;

}


@keyframes ambientMove {

    to {

        transform:
            translate(20vw,14vh)
            scale(1.18);

    }

}


@keyframes ambientMove2 {

    to {

        transform:
            translate(-18vw,-12vh)
            scale(1.22);

    }

}


/* ================================
   FLOATING PARTICLES
================================ */

.particles {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 2;

}


.p {

    position: absolute;

    width: 3px;

    height: 3px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.62);

    box-shadow:
        0 0 12px rgba(255,255,255,.7);

    animation:
        floatParticle
        linear
        infinite,

        particleGlow
        3s
        ease-in-out
        infinite
        alternate;

}


.p:nth-child(1) {

    left: 8%;

    top: 73%;

    animation-duration: 9s;

}


.p:nth-child(2) {

    left: 18%;

    top: 23%;

    animation-duration: 13s;

}


.p:nth-child(3) {

    left: 31%;

    top: 82%;

    animation-duration: 11s;

}


.p:nth-child(4) {

    left: 47%;

    top: 15%;

    animation-duration: 15s;

}


.p:nth-child(5) {

    left: 66%;

    top: 77%;

    animation-duration: 10s;

}


.p:nth-child(6) {

    left: 79%;

    top: 30%;

    animation-duration: 14s;

}


.p:nth-child(7) {

    left: 91%;

    top: 65%;

    animation-duration: 12s;

}


@keyframes floatParticle {

    0%,
    100% {

        transform:
            translate3d(0,20px,0);

        opacity: .15;

    }

    50% {

        transform:
            translate3d(12px,-35px,0);

        opacity: .9;

    }

}


@keyframes particleGlow {

    from {

        box-shadow:
            0 0 5px
            rgba(255,255,255,.25);

    }

    to {

        box-shadow:
            0 0 18px
            rgba(150,200,255,1);

    }

}


/* ================================
   PAGE
================================ */

.page {

    position: relative;

    z-index: 3;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 24px;

}


/* ================================
   MAIN GLASS CARD
================================ */

.shell {

    --rotate-x: 0deg;

    --rotate-y: 0deg;

    --mouse-x: 50%;

    --mouse-y: 50%;


    width:
        min(1080px,100%);

    min-height:
        min(
            700px,
            calc(100vh - 48px)
        );


    display: grid;

    grid-template-columns:
        1fr 1.08fr;


    direction: ltr;


    position: relative;

    overflow: hidden;


    border:
        1px solid
        var(--line);


    border-radius: 32px;


    background:
        rgba(255,255,255,.045);


    box-shadow:

        0 35px 100px
        rgba(0,0,0,.42),

        inset 0 1px 0
        rgba(255,255,255,.09);


    backdrop-filter:
        blur(24px);

    -webkit-backdrop-filter:
        blur(24px);


    transform:

        perspective(1400px)

        rotateX(var(--rotate-x))

        rotateY(var(--rotate-y));


    transition:
        transform .16s ease-out;


    transform-style:
        preserve-3d;

}


/* ================================
   MOVING LIGHT
================================ */

.shell::before {

    content: "";

    position: absolute;

    width: 280px;

    height: 280px;

    border-radius: 50%;

    top: -130px;

    left: -130px;


    background:

        radial-gradient(
            circle,
            rgba(110,175,255,.23),
            transparent 68%
        );


    filter: blur(25px);


    pointer-events: none;

    z-index: 1;


    animation:

        luxuryLight
        12s
        ease-in-out
        infinite
        alternate;

}


@keyframes luxuryLight {

    0% {

        transform:
            translate(0,0);

        opacity: .35;

    }

    50% {

        transform:
            translate(520px,260px);

        opacity: .78;

    }

    100% {

        transform:
            translate(780px,40px);

        opacity: .35;

    }

}


/* ================================
   INTERACTIVE LIGHT
================================ */

.shell::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 5;


    background:

        radial-gradient(
            circle at
            var(--mouse-x)
            var(--mouse-y),

            rgba(255,255,255,.09),

            transparent 23%
        ),

        linear-gradient(
            120deg,
            rgba(255,255,255,.055),
            transparent 35%,
            rgba(255,255,255,.02)
        );

}


/* ================================
   LIGHT SWEEP
================================ */

.shine {

    position: absolute;

    width: 32%;

    height: 150%;

    top: -25%;

    right: -55%;


    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.075),
            transparent
        );


    transform:
        rotate(18deg);


    pointer-events: none;

    z-index: 6;


    animation:

        shineMove
        8s
        ease-in-out
        infinite;

}


@keyframes shineMove {

    0%,
    65% {

        right: -55%;

        opacity: 0;

    }

    72% {

        opacity: 1;

    }

    90%,
    100% {

        right: 125%;

        opacity: 0;

    }

}


/* ================================
   LOGO SECTION
================================ */

.visual {

    direction: rtl;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 48px;


    background:

        radial-gradient(
            circle at center,
            rgba(75,138,255,.22),
            transparent 44%
        ),

        linear-gradient(
            160deg,
            rgba(16,49,107,.42),
            rgba(3,17,39,.26)
        );

}


/* Outer ring */

.visual::before {

    content: "";

    position: absolute;

    width: 72%;

    aspect-ratio: 1;

    border-radius: 50%;


    border:
        1px solid
        rgba(255,255,255,.11);


    box-shadow:

        0 0 70px
        rgba(70,135,255,.14),

        inset 0 0 50px
        rgba(255,255,255,.025);


    animation:

        spin
        24s
        linear
        infinite,

        ringPulse
        5s
        ease-in-out
        infinite;

}


/* Inner ring */

.visual::after {

    content: "";

    position: absolute;

    width: 55%;

    aspect-ratio: 1;

    border-radius: 50%;


    border:
        1px dashed
        rgba(255,255,255,.10);


    animation:

        spin
        17s
        linear
        infinite
        reverse;

}


@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


@keyframes ringPulse {

    0%,
    100% {

        opacity: .4;

    }

    50% {

        opacity: 1;

    }

}


/* ================================
   LOGO
================================ */

.logo-wrap {

    position: relative;

    width:
        min(320px,72vw);

    aspect-ratio: 1;


    display: grid;

    place-items: center;


    z-index: 2;


    transform-style:
        preserve-3d;


    animation:

        logoEntrance
        1.2s
        cubic-bezier(.2,.8,.2,1)
        both,

        logoFloat
        6s
        ease-in-out
        1.2s
        infinite;

}


/* Glow behind logo */

.logo-wrap::before {

    content: "";

    position: absolute;

    inset: 7%;

    border-radius: 50%;


    background:
        rgba(255,255,255,.07);


    box-shadow:

        0 0 75px
        rgba(77,143,255,.24);


    animation:

        logoPulse
        4s
        ease-in-out
        infinite;

}


/* Shadow below logo */

.logo-wrap::after {

    content: "";

    position: absolute;

    width: 45%;

    height: 12%;

    bottom: 7%;

    border-radius: 50%;


    background:
        rgba(70,140,255,.28);


    filter: blur(20px);


    animation:

        logoShadow
        4s
        ease-in-out
        infinite;

}


/* Actual image */

.logo {

    position: relative;

    width: 78%;

    height: 78%;

    object-fit: cover;


    border-radius: 28%;


    border:
        1px solid
        rgba(255,255,255,.18);


    box-shadow:

        0 28px 65px
        rgba(0,0,0,.45);


    transform:
        translateZ(35px);


    transition:
        transform .16s ease-out;


    user-select: none;

    -webkit-user-drag: none;

}


@keyframes logoEntrance {

    from {

        transform:
            scale(.85);

        opacity: 0;

    }

    to {

        transform:
            scale(1);

        opacity: 1;

    }

}


@keyframes logoFloat {

    0%,
    100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-12px);

    }

}


@keyframes logoPulse {

    0%,
    100% {

        box-shadow:
            0 0 75px
            rgba(77,143,255,.24);

    }

    50% {

        box-shadow:
            0 0 110px
            rgba(77,143,255,.42);

    }

}


@keyframes logoShadow {

    0%,
    100% {

        transform:
            scaleX(1);

        opacity: .6;

    }

    50% {

        transform:
            scaleX(1.2);

        opacity: .8;

    }

}

</style>

</head>

<body>

<div class="ambient"></div>

<div class="particles">

    <div class="p"></div>

    <div class="p"></div>

    <div class="p"></div>

    <div class="p"></div>

    <div class="p"></div>

    <div class="p"></div>

    <div class="p"></div>

</div>


<div class="page">

    <div class="shell">

        <div class="shine"></div>

        <div class="visual">

            <div class="logo-wrap">

                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='90' fill='%23ffffff' opacity='0.1'/%3E%3Ccircle cx='100' cy='100' r='70' fill='%23ffffff' opacity='0.2'/%3E%3Ctext x='50%' y='50%' font-size='48' font-weight='bold' fill='%23ffffff' text-anchor='middle' dominant-baseline='middle' font-family='Arial'%3ED%3C/text%3E%3C/svg%3E" alt="Dior" class="logo">

            </div>

        </div>

    </div>

</div>

</body>

</html>
