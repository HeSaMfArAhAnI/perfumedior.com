<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>فروشگاه در حال آماده‌سازی</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            background: #f8f5f2;
            color: #333;
            text-align: center;
        }

        .box {
            max-width: 600px;
            padding: 40px 25px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 2;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>فروشگاه ما به‌زودی</h1>

        <p>
            سایت در حال آماده‌سازی است.
        </p>

        <p>
            به‌زودی با مجموعه‌ای از محصولات جدید در کنار شما خواهیم بود.
        </p>
    </div>

</body>
</html>
